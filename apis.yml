aid: ironcore-labs
name: IronCore Labs
description: >-
  IronCore Labs builds application-layer encryption tools that keep sensitive
  data private while it stays usable. Its products include SaaS Shield
  (tenant-controlled envelope encryption with customer-managed keys / BYOK for
  multi-tenant SaaS), Cloaked Search (a transparent encrypting proxy for
  Elasticsearch and OpenSearch), Cloaked AI (encryption of vector embeddings for
  AI/RAG workloads while preserving similarity search), the Data Control Platform
  (end-to-end encryption SDKs where the end user holds the key), and an S3 Proxy
  for per-tenant object encryption. Developers integrate through the unified
  IronCore Alloy SDK (Rust, Python, Java, Kotlin), the legacy Tenant Security
  Client (Node.js, Go, PHP), and the self-hosted Vendor API Bridge REST API for
  programmatic tenant and KMS configuration management.
